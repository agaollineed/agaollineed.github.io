<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="Personal portfolio: experience, projects, and contact.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&family=JetBrains+Mono:wght@400;500&family=Patrick+Hand&display=swap" rel="stylesheet">
  <!-- ?v=… memaksa browser memuat versi terbaru; naikkan angkanya tiap file diubah -->
  <link rel="stylesheet" href="style.css?v=37">
</head>
<body>
  <header class="nav">
    <nav aria-label="Main navigation">
      <a href="#projects">projects</a>
      <a href="#experience" class="hide-sm">experience</a>
      <a href="#contact">contact</a>
    </nav>
  </header>

  <main class="wrap" id="top">
    <section class="hero-wrap" aria-label="Introduction">
      <div class="hero" id="hero">
        <canvas id="bokeh" aria-hidden="true"></canvas>
        <video id="bannerVideo" muted loop playsinline preload="auto" aria-hidden="true" tabindex="-1" hidden></video>
        <h1 id="name"></h1>
        <p class="tagline" id="tagline"></p>
      </div>
      <div class="avatar" aria-hidden="true">
        <svg class="ring" viewBox="0 0 200 200">
          <defs><path id="ringPath" d="M100,100 m-86,0 a86,86 0 1,1 172,0 a86,86 0 1,1 -172,0"/></defs>
          <circle cx="100" cy="100" r="100" class="ring-bg"/>
          <text class="ring-text"><textPath href="#ringPath" id="ringText" textLength="534" lengthAdjust="spacing"></textPath></text>
        </svg>
        <div class="photo" id="photo"></div>
      </div>
    </section>

    <section class="card intro slant top-up bottom-down">
      <h2 id="greeting"></h2>
      <p class="lead" id="intro"></p>

      <ul class="timeline">
        <li class="now"><span class="label">Now</span><span id="now"></span></li>
        <li id="previouslyRow"><span class="label">Previously</span><span id="previously"></span></li>
      </ul>

      <p id="highlightsTitle"></p>
      <ul class="highlights" id="highlights"></ul>

      <div class="chips" id="contacts"></div>
    </section>

    <section class="card slant top-down bottom-up" id="projects">
      <h2 id="projectsTitle"></h2>
      <p class="sub" id="projectsIntro"></p>
      <div class="filters" id="filters" role="group" aria-label="Filter projects"></div>
      <div class="grid" id="projectGrid"></div>
    </section>

    <section class="card slant top-up bottom-down" id="experience">
      <h2 id="xpTitle"></h2>
      <p class="sub" id="xpIntro"></p>
      <div id="xpGroups"></div>
    </section>

    <section class="card contact top-down" id="contact">
      <h2 id="contactTitle"></h2>
      <p id="contactText"></p>
      <a class="button" id="contactButton"></a>
    </section>
  </main>

  <footer class="footer">
    <span id="footerText"></span>
    <a href="#top">back to top ↑</a>
  </footer>

  <script src="data.js?v=37"></script>
  <script src="app.js?v=37"></script>
</body>
</html>
